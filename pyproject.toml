[project]
name = "kzkitty"
version = "0.1.0"
description = "Discord bot for the CS:GO and CS2 KZ global APIs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hikari-arc[rest]>=2.3.0",
    "hikari[server,speedups]>=2.5.0",
    "pydantic>=2.13.4",
    "tortoise-orm>=1.1.7",
    "urllib3-future[brotli,zstd]>=2.22.901",
    "uvloop>=0.22.1",
]

[tool.basedpyright]
pythonVersion = "3.13"
reportImplicitStringConcatenation = false
reportUnusedCallResult = false
typeCheckingMode = "strict"

[tool.mypy]
native_parser = true
python_executable = ".venv/bin/python"
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "BLE", "C4", "DTZ", "E", "ERA", "F", "FIX",
          "FURB", "ISC", "INP", "G", "PERF", "PIE", "RSE", "RUF", "S", "SIM",
          "SLF", "T20", "TC", "TID", "UP", "W"]
ignore = [
    "blank-lines-after-function-or-class",
    "blank-lines-before-nested-definition",
    "blank-lines-top-level",
    "missing-whitespace-around-parameter-equals",
    "non-empty-init-module",
    "suspicious-xml-element-tree-usage",
    "suspicious-xml-etree-import",
    "too-few-spaces-before-inline-comment",
]
preview = true

[tool.pyrefly]
preset = "strict"
python-version = "3.13"

[tool.ty.rules]
division-by-zero = "warn"
missing-override-decorator = "warn"
missing-type-argument = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"

[tool.uv.sources.hikari]
git = "https://github.com/hikari-py/hikari.git"
rev = "1ae003c70feeed6b7d346eb49f1cb541922a0f23"
